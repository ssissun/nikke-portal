<script>
  // 테마·사이드바 접힘 상태를 첫 렌더 전에 적용 (깜빡임 방지). 저장된 테마가 없으면 시스템 설정을 따른다
  try {
    const t = localStorage.getItem("nikke-hub:theme");
    document.documentElement.dataset.theme = t === "light" || t === "dark" ? t
      : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    if (localStorage.getItem("nikke-hub:nav-collapsed") === "true") document.documentElement.classList.add("nav-collapsed");
  } catch {}
</script>
<style>
  /* 색은 NIKKE 스토리 감상 순서(nikke-storyline)와 같은 팔레트: 다크 = 심해·우주, 라이트 = 측량 지도 */
  :root {
    --bg: #09152B;
    --panel: #0E1D39;
    --panel-2: #172B4D;
    --card-border: #2C4A7C;
    --line: rgba(234, 241, 250, .12);
    --text: #EAF1FA;
    --muted: #8A9CBC;
    --accent: #5DC2F0;
    --on-accent: #06101F;
    --warn: #E2A555;
    --star: #F2C674;
    --serif-en: "Iowan Old Style", "Charter", "Georgia", serif;
    --sidebar-w: 264px;
    --topbar-h: 52px;
    --pane-head-h: 38px;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #E3E9EC;
    --panel: #F8FAFB;
    --panel-2: #EDF3F7;
    --card-border: rgba(19, 35, 63, .14);
    --line: rgba(19, 35, 63, .14);
    --text: #13233F;
    --muted: #5D6C84;
    --accent: #0A74B8;
    --on-accent: #FFFFFF;
    --warn: #A86A00;
    --star: #B97A06;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 14px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* 홈 배경: 빛 번짐 + 64px 격자 + 별 (라이트는 별 대신 측량 십자·등고선) */
  .page {
    background-color: var(--bg);
    background-image:
      radial-gradient(ellipse at 18% 0%, rgba(93, 194, 240, .16), transparent 55%),
      radial-gradient(ellipse at 85% 30%, rgba(181, 148, 232, .10), transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(79, 207, 174, .08), transparent 60%),
      linear-gradient(rgba(93, 194, 240, .05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(93, 194, 240, .05) 1px, transparent 1px),
      radial-gradient(circle at 12% 18%, rgba(234, 241, 250, .55) .5px, transparent 1px),
      radial-gradient(circle at 78% 42%, rgba(234, 241, 250, .45) .5px, transparent 1px),
      radial-gradient(circle at 32% 72%, rgba(234, 241, 250, .45) .5px, transparent 1px),
      radial-gradient(circle at 88% 88%, rgba(234, 241, 250, .50) .5px, transparent 1px),
      radial-gradient(circle at 55% 15%, rgba(234, 241, 250, .40) .5px, transparent 1px),
      radial-gradient(circle at 8% 60%, rgba(234, 241, 250, .45) .5px, transparent 1px);
    background-size: 100% 100%, 100% 100%, 100% 100%, 64px 64px, 64px 64px,
                     220px 220px, 340px 340px, 280px 280px, 400px 400px, 260px 260px, 360px 360px;
  }
  :root[data-theme="light"] .page {
    background-image:
      radial-gradient(ellipse at 18% 0%, rgba(10, 116, 184, .12), transparent 55%),
      radial-gradient(ellipse at 85% 30%, rgba(116, 68, 201, .07), transparent 50%),
      radial-gradient(ellipse at 50% 100%, rgba(11, 138, 107, .07), transparent 60%),
      linear-gradient(rgba(19, 35, 63, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(19, 35, 63, .045) 1px, transparent 1px),
      url("assets/bg-survey.svg"),
      url("assets/bg-topo.svg");
    background-size: 100% 100%, 100% 100%, 100% 100%, 64px 64px, 64px 64px, 640px 640px, 720px 720px;
  }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  svg { display: block; }

  .app { display: grid; grid-template-columns: var(--sidebar-w) 1fr; height: 100dvh; transition: grid-template-columns .2s ease; }
  .nav-collapsed .app { grid-template-columns: 0 1fr; }
  .nav-collapsed .sidebar { visibility: hidden; border-right-width: 0; }

  /* Sidebar */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    min-height: 0; min-width: 0; overflow: hidden;
  }
  .brand {
    display: flex; align-items: center; gap: 8px;
    height: var(--topbar-h); padding: 0 16px;
    border-bottom: 1px solid var(--line);
    font-weight: 700; letter-spacing: .02em;
    text-decoration: none;
  }
  .brand { font-size: 16px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .nav {
    overflow-y: auto; padding: 8px 8px 24px; flex: 1;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .nav::-webkit-scrollbar { width: 6px; }
  .nav::-webkit-scrollbar-track { background: transparent; }
  .nav::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
  .nav::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  .nav h3 {
    margin: 16px 8px 6px; font-size: 11px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
  }
  .nav a {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 8px; text-decoration: none;
    color: var(--text);
  }
  .nav a .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav a svg { flex-shrink: 0; color: var(--muted); }
  .nav a:hover { background: var(--panel-2); }
  .nav a.active { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .nav a.active svg { color: var(--on-accent); }
  .nav .quick { border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  .nav .quick:empty { display: none; }
  .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 999px;
    border: 1px solid currentColor; color: var(--warn); white-space: nowrap;
  }
  .nav a.active .badge { color: var(--on-accent); }

  /* Main */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .topbar {
    display: flex; align-items: center; gap: 6px;
    height: var(--topbar-h); padding: 0 12px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .topbar .title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .title small { color: var(--muted); font-weight: 400; margin-left: 6px; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    height: 34px; min-width: 34px; padding: 0 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel-2);
    text-decoration: none; white-space: nowrap;
  }
  .icon-btn:hover { border-color: var(--muted); }
  .icon-btn.on { border-color: var(--accent); color: var(--accent); }
  .icon-btn.star.on { border-color: var(--star); color: var(--star); }
  .icon-btn.star.on svg { fill: currentColor; }
  .icon-btn.off { opacity: .4; cursor: not-allowed; }
  .icon-btn.off:hover { border-color: var(--line); }
  .icon-btn kbd { font: 11px/1 inherit; color: var(--muted); }

  .viewport { position: relative; flex: 1; min-height: 0; background: #fff; }
  .viewport iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  .loading {
    position: absolute; top: 0; left: 0; right: 0; height: 3px; overflow: hidden; z-index: 3;
  }
  .loading::before {
    content: ""; position: absolute; inset: 0; width: 40%;
    background: var(--accent); animation: slide 1s ease-in-out infinite;
  }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }

  /* Split view (PC) */
  .viewport.split { background: var(--line); }
  .viewport.split iframe.pane-left,
  .viewport.split iframe.pane-right { top: var(--pane-head-h); height: calc(100% - var(--pane-head-h)); }
  .viewport.split iframe.pane-left { width: calc(var(--split, 50%) - 3px); }
  .viewport.split iframe.pane-right { left: calc(var(--split, 50%) + 3px); width: calc(100% - var(--split, 50%) - 3px); }
  .splitter {
    position: absolute; top: 0; bottom: 0; left: calc(var(--split, 50%) - 3px); width: 6px; z-index: 4;
    background: var(--line); cursor: col-resize; touch-action: none;
  }
  .splitter::after {
    content: ""; position: absolute; top: 50%; left: 2px; width: 2px; height: 32px; margin-top: -16px;
    border-radius: 1px; background: var(--muted); opacity: .6;
  }
  .splitter:hover, .splitter:focus-visible, .viewport.resizing .splitter { background: var(--accent); outline: none; }
  .viewport:not(.split) .splitter { display: none; }
  .viewport.resizing { cursor: col-resize; user-select: none; }
  .viewport.resizing iframe { pointer-events: none; }
  .pane-head {
    position: absolute; top: 0; height: var(--pane-head-h); z-index: 2;
    display: flex; align-items: center; gap: 6px; padding: 0 6px 2px 12px; /* 아래 2px: 강조 줄과 버튼 사이 여유 */
    background: var(--panel-2); font-size: 13px; font-weight: 600;
  }
  .pane-head span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pane-head .icon-btn { height: 26px; min-width: 26px; padding: 0 6px; font-size: 12px; font-weight: 400; }
  #paneHeadL { left: 0; width: calc(var(--split, 50%) - 3px); }
  #paneHeadR { left: calc(var(--split, 50%) + 3px); right: 0; }
  .viewport:not(.split) .pane-head { display: none; }
  /* 사이트 이동이 일어날 칸 표시: 옮길 때는 떠나는 줄이 흐려지는 동시에 도착하는 줄이 나타난다 */
  .pane-head::after {
    /* 사이트와 붙으면 묻히므로 제목줄 바탕을 1px 띄워 두고 번짐도 제목줄 쪽으로만 */
    content: ""; position: absolute; left: 0; right: 0; bottom: 1px; height: 3px; pointer-events: none;
    background: var(--accent);
    box-shadow: 0 -2px 14px color-mix(in srgb, var(--accent) 65%, transparent);
    opacity: 0; transition: opacity .2s ease;
  }
  :root[data-theme="light"] .pane-head::after { /* 밝은 바탕에선 번짐이 묻히므로 더 굵고 진하게 */
    box-shadow: 0 -3px 18px color-mix(in srgb, var(--accent) 60%, transparent);
  }
  .pane-head.active::after { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .pane-head::after { transition: none; } }
  /* 위아래 나란히 보기 */
  .viewport.split.col iframe.pane-left { left: 0; width: 100%; height: calc(var(--split-v, 50%) - 3px - var(--pane-head-h)); }
  .viewport.split.col iframe.pane-right {
    left: 0; width: 100%;
    top: calc(var(--split-v, 50%) + 3px + var(--pane-head-h)); height: calc(100% - var(--split-v, 50%) - 3px - var(--pane-head-h));
  }
  .viewport.split.col .splitter { top: calc(var(--split-v, 50%) - 3px); bottom: auto; left: 0; right: 0; width: auto; height: 6px; cursor: row-resize; }
  .viewport.split.col .splitter::after { top: 2px; left: 50%; width: 32px; height: 2px; margin: 0 0 0 -16px; }
  .viewport.resizing.col { cursor: row-resize; }
  .viewport.split.col #paneHeadL { width: auto; right: 0; }
  .viewport.split.col #paneHeadR { left: 0; top: calc(var(--split-v, 50%) + 3px); }

  /* Home / blocked panels */
  .page { flex: 1; overflow-y: auto; padding: 24px; }
  /* 홈 머리: storyline masthead처럼 위 시안 선 + 영문 세리프 + 빛나는 강조 */
  .masthead { border-top: 2px solid var(--accent); border-bottom: 1px solid var(--line); padding: 20px 0 16px; margin-bottom: 24px; }
  .page h1 { margin: 0 0 8px; font-size: 34px; font-weight: 700; line-height: 1.1; letter-spacing: -.01em; }
  .en { font-family: var(--serif-en); }
  .accent { color: var(--accent); }
  h1 .accent { text-shadow: 0 0 24px rgba(93, 194, 240, .44), 0 0 8px rgba(93, 194, 240, .32); }
  :root[data-theme="light"] h1 .accent { text-shadow: none; }
  .page .lead { margin: 0; color: var(--muted); }
  .page .lead kbd { padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; font: 12px inherit; }
  .group { margin-bottom: 24px; }
  .group h2 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .card {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px; border-radius: 4px; text-decoration: none;
    background: linear-gradient(135deg, rgba(93, 194, 240, .06), transparent 50%), var(--panel-2);
    border: 1px solid var(--card-border);
    box-shadow: 0 4px 16px rgba(0, 0, 0, .45), 0 0 0 1px rgba(93, 194, 240, .064) inset, 0 0 24px rgba(93, 194, 240, .04);
    transition: border-color .28s ease, transform .28s ease, box-shadow .28s ease;
  }
  .card:hover {
    border-color: var(--accent); transform: translateY(-2px);
    box-shadow: 0 8px 22px rgba(0, 0, 0, .5), 0 0 0 1px rgba(93, 194, 240, .12) inset, 0 0 28px rgba(93, 194, 240, .10);
  }
  :root[data-theme="light"] .card { background: var(--panel); box-shadow: 0 1px 0 rgba(19, 35, 63, .05), 0 14px 28px -16px rgba(10, 116, 184, .55); }
  :root[data-theme="light"] .card:hover { box-shadow: 0 1px 0 rgba(19, 35, 63, .05), 0 18px 30px -14px rgba(10, 116, 184, .6); }
  .card .ico {
    display: grid; place-items: center; flex-shrink: 0; width: 34px; height: 34px; border-radius: 4px;
    background: rgba(93, 194, 240, .12); color: var(--accent);
  }
  :root[data-theme="light"] .card .ico { background: rgba(10, 116, 184, .10); }
  .card .txt { flex: 1; min-width: 0; }
  .card span.desc { display: block; }
  .card b { display: flex; justify-content: space-between; gap: 6px; margin-bottom: 4px; }
  .card span.desc { color: var(--muted); font-size: 12px; }
  .guide {
    padding: 14px 16px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--card-border); border-left: 3px solid var(--accent);
    color: var(--muted); font-size: 13px; line-height: 1.7;
  }
  .guide p { margin: 0; }
  .guide ol { margin: 6px 0 0; padding-left: 20px; }
  .guide a { color: var(--accent); }
  .guide b { color: var(--text); font-weight: 600; }
  .notice {
    max-width: 480px; margin: 12vh auto 0; text-align: center;
  }
  .notice p { color: var(--muted); line-height: 1.6; }
  .notice .icon-btn { height: 42px; padding: 0 18px; background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  /* 화면 아래 안내 (예: 두 번째 새 탭이 막혔을 때) */
  .hint {
    position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 5;
    display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 8px;
    background: var(--panel); color: var(--text); border: 1px solid var(--warn); font-size: 13px;
  }
  .hint span { flex: 1; }
  /* 나란히 보기에서 사이트별 안내는 그 사이트 칸 안에만 (경계선 반쪽 3px + 여백 12px) */
  .viewport.split .hint[data-pane="left"] { right: calc(100% - var(--split, 50%) + 15px); }
  .viewport.split .hint[data-pane="right"] { left: calc(var(--split, 50%) + 15px); }
  .viewport.split.col .hint[data-pane="left"] { right: 12px; bottom: calc(100% - var(--split-v, 50%) + 15px); }
  .viewport.split.col .hint[data-pane="right"] { left: 12px; }

  /* Mobile favorites bar */
  .tabbar { display: none; }

  /* Search palette */
  .palette {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(0,0,0,.55);
    display: flex; justify-content: center; align-items: flex-start;
    padding: 12vh 16px 16px;
  }
  .palette-box {
    width: min(560px, 100%); max-height: 70vh; display: flex; flex-direction: column;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .palette-box .mode { padding: 10px 16px 0; font-size: 12px; color: var(--accent); }
  .palette input {
    width: 100%; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line);
    background: transparent; color: var(--text); font: inherit; font-size: 16px; outline: none;
  }
  .palette ul { list-style: none; margin: 0; padding: 6px; overflow-y: auto; }
  .palette li {
    display: flex; align-items: center; gap: 8px;
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
  }
  .palette li small { color: var(--muted); margin-left: auto; white-space: nowrap; }
  .palette li > svg { color: var(--muted); }
  .palette li .fav { color: var(--star); }
  .palette li .fav svg { fill: currentColor; }
  .palette li[aria-selected="true"] { background: var(--panel-2); outline: 1px solid var(--accent); }
  .palette .empty { padding: 16px; color: var(--muted); text-align: center; }

  /* 내 사이트 */
  .nav h3.custom-head { display: flex; align-items: center; justify-content: space-between; }
  .add-btn { font-size: 11px; color: var(--accent); padding: 2px 6px; border-radius: 6px; text-transform: none; letter-spacing: 0; }
  .add-btn:hover { background: var(--panel-2); }
  .nav-row { display: flex; align-items: center; gap: 2px; }
  .nav-row a { flex: 1; min-width: 0; }
  /* 메뉴 줄의 즐겨찾기 별: 즐겨찾기면 늘 보이고, 아니면 줄에 마우스를 올렸을 때만 */
  .fav-toggle { display: grid; place-items: center; flex-shrink: 0; width: 26px; height: 26px; border-radius: 6px; color: var(--muted); opacity: 0; }
  .nav-row:hover .fav-toggle, .fav-toggle:focus-visible { opacity: 1; }
  .fav-toggle:hover { background: var(--panel-2); color: var(--star); }
  .fav-toggle.on { opacity: 1; color: var(--star); }
  .fav-toggle.on svg { fill: currentColor; }
  @media (hover: none) { .fav-toggle { opacity: .45; } .fav-toggle.on { opacity: 1; } }
  .del { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; color: var(--muted); font-size: 12px; opacity: 0; }
  .nav-row:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { background: var(--panel-2); color: var(--accent); }

      { id: "story-ssissun", name: "스토리 순서 (storyline)", short: "스토리A", icon: "listOrdered", url: "https://ssissun.github.io/nikke-storyline" },
      { id: "story-github", name: "스토리 순서 (nikke-story)", short: "스토리B", icon: "listOrdered", url: "https://nikke-story.github.io/" },
      { id: "story-dc", name: "스토리 순서 (디시 뉴비 정리)", short: "스토리C", icon: "listOrdered", url: "https://gall.dcinside.com/mgallery/board/view/?id=gov&no=4053990", sync: false },
    ]},
    { name: "육성", items: [
      { id: "growth", name: "니케 육성 정리", short: "육성정리", icon: "book", url: "https://arca.live/b/nikketgv/125575794", sync: false, hint: ARCA_HINT },
    ]},
    { name: "패키지", items: [
      { id: "package", name: "패키지 효율표 시트", short: "패키지", icon: "package",
        url: "https://docs.google.com/spreadsheets/d/1qUSwYnpDtWAD_aq_4L6dC6py2vM19WtLed2AGKSdIPk/edit?gid=2059216737#gid=2059216737",
        src: "https://docs.google.com/spreadsheets/d/1qUSwYnpDtWAD_aq_4L6dC6py2vM19WtLed2AGKSdIPk/htmlview?gid=2059216737", sync: false },
    ]},
  ];

  // 내 사이트: 방문자가 직접 추가한 주소 (이 브라우저에만 저장)
  const CUSTOM_CATEGORY = "내 사이트";
  function loadCustom() {
    try {
      const list = JSON.parse(localStorage.getItem("nikke-hub:custom") || "[]");
      return Array.isArray(list)
        ? list.filter(i => i && typeof i.id === "string" && typeof i.name === "string" && /^https?:\/\//.test(i.url))
        : [];
    } catch { return []; }
  }
  let customSites = loadCustom();

  let ALL, ITEMS;
  function buildCatalog() {
    const cats = [...CATEGORIES, { name: CUSTOM_CATEGORY, items: customSites }];
    ALL = cats.flatMap(c => c.items.map(i => ({ ...i, category: c.name })));
    ITEMS = Object.fromEntries(ALL.map(i => [i.id, i]));
  }
  buildCatalog();

  const HOME_TITLE = document.title;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = id => document.getElementById(id);
  const embeddable = item => item.embed !== false;
  const frames = {}; // 한 번 연 사이트는 iframe을 유지해 탭 전환 시 입력 상태를 보존

  // 즐겨찾기·최근·마지막 화면은 이 브라우저에만 저장 (저장소가 막혀 있어도 동작)
  const store = {
    get(key, fallback) {
      try { const v = localStorage.getItem("nikke-hub:" + key); return v === null ? fallback : JSON.parse(v); }
      catch { return fallback; }
    },
    set(key, value) {
      try { localStorage.setItem("nikke-hub:" + key, JSON.stringify(value)); } catch {}
    },
  };
  let favorites = store.get("favorites", []).filter(id => ITEMS[id]);
  let recent = store.get("recent", []).filter(id => ITEMS[id]);
  const RECENT_MAX = 5;

  function addRecent(id) {
    recent = [id, ...recent.filter(r => r !== id)].slice(0, RECENT_MAX);
    store.set("recent", recent);
  }
  function toggleFavorite(id) {
    const on = !favorites.includes(id);
    favorites = on ? [...favorites, id] : favorites.filter(f => f !== id);
    store.set("favorites", favorites);
    track("favorite", { ...siteProps(ITEMS[id]), on: on ? "on" : "off" });
  }

  // ---- 방문 분석 이벤트 (Umami) ----
  // open: 어떤 사이트를 어디서(from) 여는지 · favorite · split · custom-add/remove.
  // 내 사이트는 기본 목록에 넣을 후보를 찾으려고, 추가 창에서 수집을 허용한 사이트(share)만 이름·주소까지 보낸다.
  // Umami 스크립트(defer)가 늦게 뜨면 그 전 이벤트는 모아 두었다가 로드되면 보낸다
  const pendingEvents = [];
  function track(name, data) {
    if (window.umami) window.umami.track(name, data);
    else pendingEvents.push([name, data]);
  }
  document.querySelector("script[data-website-id]")?.addEventListener("load", () => {
    pendingEvents.splice(0).forEach(([name, data]) => window.umami?.track(name, data));
  });
  const siteProps = item => {
    if (item.category !== CUSTOM_CATEGORY) return { site: item.id };
    return item.share ? { site: "custom", name: item.name.slice(0, 100), url: item.url.slice(0, 500) } : { site: "custom" };
  };

  // ---- 렌더링 조각 ----
  const badge = item => embeddable(item) ? "" : '<span class="badge">새 탭</span>';
  const linkAttrs = item => embeddable(item)
    ? `href="#${item.id}" data-id="${item.id}"`
    : `href="${esc(item.url)}" target="_blank" rel="noopener" data-id="${item.id}"`;
  const siteIcon = (item, size) => icon(item.icon || "link", size);
  const navLink = item => `<a ${linkAttrs(item)} title="${esc(item.name)}">${siteIcon(item, 16)}<span class="nm">${esc(item.name)}</span>${badge(item)}</a>`;
  const card = item => `<a class="card" ${linkAttrs(item)}><span class="ico">${siteIcon(item, 18)}</span><span class="txt"><b>${esc(item.name)}${badge(item)}</b><span class="desc">${esc(item.desc || new URL(item.url).hostname)}</span></span></a>`;

  const favToggle = item => {
    const on = favorites.includes(item.id);
    const label = `${esc(item.name)} 즐겨찾기 ${on ? "해제" : "추가"}`;
    return `<button class="fav-toggle${on ? " on" : ""}" data-fav="${item.id}" aria-pressed="${on}" title="${label}" aria-label="${label}">${icon("star", 14)}</button>`;
  };
  const navRow = item => `<div class="nav-row">${navLink(item)}${favToggle(item)}</div>`;

  function renderNav() {
    $("navCats").innerHTML =
      CATEGORIES.map(c => `<h3>${c.name}</h3>` + c.items.map(navRow).join("")).join("") +
      `<h3 class="custom-head">${CUSTOM_CATEGORY}<button class="add-btn" data-add-site>+ 추가</button></h3>` +
      customSites.map(i => `<div class="nav-row">${navLink(i)}${favToggle(i)}<button class="del" data-del="${i.id}" title="삭제" aria-label="${esc(i.name)} 삭제">${icon("x", 14)}</button></div>`).join("");
  }
  renderNav();

  const homeGroup = (title, items, from = "home") => `<div class="group" data-from="${from}"><h2>${title}</h2><div class="cards">${items.map(card).join("")}</div></div>`;
  function renderHome() {
    const favItems = favorites.map(id => ITEMS[id]);
    $("home").innerHTML = `
      <header class="masthead">
      <h1><span class="en">NIKKE</span> <span class="accent">Portal</span></h1>
      <p class="lead">니케 유용한 사이트 모음 — 대부분은 이 화면 안에서 바로 열립니다. <kbd>Ctrl</kbd>+<kbd>K</kbd>로 검색.</p>
      </header>
      ${favItems.length ? homeGroup("★ 즐겨찾기", favItems, "home-fav") : ""}
      ${CATEGORIES.map(c => homeGroup(c.name, c.items)).join("")}
      <div class="group" data-from="home"><h2>${CUSTOM_CATEGORY}</h2><div class="cards">
        ${customSites.map(card).join("")}
        <button class="card add-card" data-add-site><span class="ico">${icon("plus", 18)}</span><span class="txt"><b>사이트 추가</b><span class="desc">주소를 넣으면 이 브라우저의 목록에 추가됩니다</span></span></button>
      </div></div>
      <div class="group"><h2>저장 데이터 연동 (선택, PC)</h2><div class="guide">
        <p>화면 안에 띄운 사이트는 원래 사이트에 직접 들어갔을 때와 저장 데이터가 따로 관리됩니다. 사용자 스크립트를 설치하면 여기서도 같은 데이터를 씁니다.</p>
        <ol>
          <li><a href="https://www.tampermonkey.net/" target="_blank" rel="noopener">Tampermonkey</a> 설치 — Chrome·Edge는 확장 프로그램 관리에서 <b>사용자 스크립트 허용</b>을 켜기</li>
          <li><a href="https://ssissun.github.io/nikke-portal/nikke-portal-sync.user.js" target="_blank" rel="noopener">연동 스크립트 설치</a> — 설치 화면에 "모든 사이트에서 실행"으로 나오지만, 이 화면에서 연 사이트에서만 동작합니다</li>
          <li>여기서 사이트를 한 번 열기 → 원래 사이트에 <b>직접 한 번 들어가기</b> → 여기서 ⟳ 새로고침</li>
        </ol>
        <p>바뀌기 전 값은 백업으로 남고, Tampermonkey 메뉴 → <b>백업 복원</b>으로 되살릴 수 있습니다. <a href="https://github.com/ssissun/nikke-portal#저장-데이터-연동-선택-pc" target="_blank" rel="noopener">자세한 설명</a></p>
      </div></div>`;
  }

  // ---- 내 사이트 추가·삭제 ----
  function saveCustom() {
    store.set("custom", customSites);
    buildCatalog();
    favorites = favorites.filter(id => ITEMS[id]);
    recent = recent.filter(id => ITEMS[id]);
    store.set("favorites", favorites);
    store.set("recent", recent);
    renderNav();
  }
  function addCustomSite(name, short, rawUrl, newTab, share) {
    let parsed;
    try { parsed = new URL(/^https?:\/\//i.test(rawUrl) ? rawUrl : "https://" + rawUrl); } catch { return null; }
    if (!/^[a-z0-9-]+(\.[a-z0-9-]+)+$/i.test(parsed.hostname)) return null;
    const url = parsed.href;
    const item = { id: "my-" + Date.now().toString(36), name, ...(short ? { short } : {}), url };
    if (newTab) item.embed = false;
    if (share) item.share = true;
    customSites = [...customSites, item];
    saveCustom();
    return item;
  }
  function removeCustomSite(id) {
    customSites = customSites.filter(i => i.id !== id);
    if (frames[id]) { frames[id].remove(); delete frames[id]; }
    saveCustom();
    if (current === id || currentRight === id) location.hash = current === id ? "" : current;
    else render();
  }
  function openAddDialog() {
    closeNav();
    $("addForm").reset();
    $("siteShare").checked = store.get("share-custom", true); // 수집 허용 여부는 지난번 선택을 기억한다
    $("addError").hidden = true;
    $("addDialog").showModal();
  }
  $("addForm").addEventListener("submit", e => {
    e.preventDefault();
    store.set("share-custom", $("siteShare").checked);
    const item = addCustomSite($("siteName").value.trim(), $("siteShort").value.trim(), $("siteUrl").value.trim(), $("siteNewTab").checked, $("siteShare").checked);
    if (!item) { $("addError").hidden = false; return; }
    track("custom-add", siteProps(ITEMS[item.id]));
    $("addDialog").close();
    if (embeddable(item)) go(item.id);
    else render();
  });
  $("addCancel").addEventListener("click", () => $("addDialog").close());

  function renderQuick() {
    const favItems = favorites.map(id => ITEMS[id]);
    const recentItems = recent.filter(id => id !== current && !favorites.includes(id)).slice(0, 4).map(id => ITEMS[id]);
    $("navQuick").innerHTML =
      (favItems.length ? `<div data-from="nav-fav"><h3>★ 즐겨찾기</h3>${favItems.map(navRow).join("")}</div>` : "") +
      (recentItems.length ? `<div data-from="nav-recent"><h3>최근</h3>${recentItems.map(navRow).join("")}</div>` : "");
    document.querySelectorAll("#navCats [data-fav]").forEach(b => {
      const on = favorites.includes(b.dataset.fav), name = ITEMS[b.dataset.fav].name;
      b.classList.toggle("on", on);
      b.setAttribute("aria-pressed", String(on));
      b.title = `${name} 즐겨찾기 ${on ? "해제" : "추가"}`;
      b.setAttribute("aria-label", b.title);
    });
    renderTabbar();
    document.querySelectorAll(".nav a, .tabbar a").forEach(a =>
      a.classList.toggle("active", current ? a.dataset.id === current : a.hasAttribute("data-home")));
  }

  // 모바일 하단 탭: 홈 + 5칸 (320px 폭에서도 4글자가 잘리지 않는 칸 수). 즐겨찾기를 먼저 넣고, 남는 칸은 아래 순서로 채운다
  const TAB_SLOTS = 5;
  const TAB_DEFAULTS = ["shiftypad", "dildoro", "module-opt", "doll-opt", "deck-simple"];
  function renderTabbar() {
    const ids = [...new Set([...favorites, ...TAB_DEFAULTS])].slice(0, TAB_SLOTS);
    $("tabbar").style.setProperty("--tabs", ids.length + 1);
    $("tabbar").innerHTML = `<a href="#" data-home>${icon("home", 18)}<span>홈</span></a>` +
      ids.map(id => ITEMS[id]).map(i => `<a ${linkAttrs(i)}>${embeddable(i) ? siteIcon(i, 18) : icon("external", 18)}<span>${esc(i.short || i.name)}</span></a>`).join("");
  }

  // ---- iframe ----
  function getFrame(item) {
    if (!frames[item.id]) {
      const f = document.createElement("iframe");
      f.allow = "fullscreen; clipboard-read; clipboard-write";
      f.referrerPolicy = "strict-origin-when-cross-origin";
      if (item.sync !== false) f.name = "nikke-hub-sync"; // 저장 데이터 연동 스크립트가 이 이름으로 포털 안인지 알아본다
      f.dataset.loading = "1";
      f.addEventListener("load", () => { delete f.dataset.loading; updateLoading(); });
      f.src = item.src || item.url;
      $("viewport").appendChild(f);
      frames[item.id] = f;
    }
    return frames[item.id];
  }
  function updateLoading() {
    $("loading").hidden = !Object.values(frames).some(f => !f.hidden && f.dataset.loading);
  }

  // ---- 라우팅: #왼쪽id 또는 #왼쪽id|오른쪽id ----
  let current = null, currentRight = null;
  let activePane = "left"; // 나란히 보기에서 마지막으로 포커스된 칸. 사이트 이동은 이 칸을 바꾼다

  function parseHash() {
    const [a, b] = decodeURIComponent(location.hash.slice(1)).split("|");
    const left = ITEMS[a] || null;
    let right = ITEMS[b] || null;
    if (!left || !embeddable(left) || !right || !embeddable(right) || right === left) right = null;
    return { left, right };
  }

  function go(id) {
    if (!currentRight) { location.hash = id; return; }
    // 이미 떠 있는 사이트를 고르면 그 칸으로 포커스만 옮긴다
    const shownAt = id === current ? "left" : id === currentRight ? "right" : null;
    if (shownAt) { setActivePane(shownAt); frames[id].focus(); return; }
    location.hash = activePane === "right" ? `${current}|${id}` : `${id}|${currentRight}`;
  }

  // ---- 나란히 보기 방향: 좌우(row)·위아래(col). 두 칸이 각각 MIN_PANE px 이상 나오는 방향만 쓴다 ----
  const MIN_PANE = 380;
  let splitDir = null; // 지금 화면에 적용된 방향 (나란히 보기가 아니면 null)

  function splitDirs() {
    const rootStyle = getComputedStyle(document.documentElement);
    const drawer = matchMedia("(max-width: 768px)").matches;
    const navW = drawer || document.documentElement.classList.contains("nav-collapsed") ? 0 : parseFloat(rootStyle.getPropertyValue("--sidebar-w"));
    const paneHead = parseFloat(rootStyle.getPropertyValue("--pane-head-h"));
    const w = innerWidth - navW;
    const h = innerHeight - document.querySelector(".topbar").offsetHeight - $("tabbar").offsetHeight;
    return [...(w >= MIN_PANE * 2 ? ["row"] : []), ...(h >= (MIN_PANE + paneHead) * 2 + 6 ? ["col"] : [])];
  }
  // 마지막에 고른 방향을 쓰고, 그 방향이 안 되는 화면이면 되는 쪽으로
  function pickDir(dirs) {
    const pref = store.get("split-dir", "row");
    return dirs.includes(pref) ? pref : dirs[0] || null;
  }

  function render() {
    const { left, right } = parseHash();
    current = left ? left.id : null;
    currentRight = right ? right.id : null;
    closeNav();

    if (left) addRecent(left.id);
    renderQuick();
    const dirs = left && embeddable(left) ? splitDirs() : []; // 하단 탭 높이가 들어가므로 renderQuick 다음에
    splitDir = right ? pickDir(dirs) : null;

    $("home").hidden = !!left;
    $("blocked").hidden = !(left && !embeddable(left));
    $("viewport").hidden = !(left && embeddable(left));
    $("favBtn").hidden = $("openBtn").hidden = !left;
    $("reloadBtn").hidden = !(left && embeddable(left));
    $("hint").hidden = true;
    Object.values(frames).forEach(f => { f.hidden = true; f.classList.remove("pane-left", "pane-right"); });
    $("viewport").classList.toggle("split", !!splitDir);
    $("viewport").classList.toggle("col", splitDir === "col");
    renderSplitControls(dirs);
    setActivePane(splitDir ? activePane : "left");

    if (!left) {
      store.set("last", null);
      $("title").textContent = "홈";
      document.title = HOME_TITLE;
      renderHome();
      updateLoading();
      return;
    }

    store.set("last", location.hash.slice(1));

    renderFavBtn();
    $("title").innerHTML = `${esc(left.name)}<small>${left.category}</small>`;
    document.title = `${left.name} · NIKKE Portal`;
    $("openBtn").href = left.url;
    $("reloadBtn").title = splitDir ? "두 사이트 모두 새로고침" : "새로고침";
    $("reloadBtn").setAttribute("aria-label", $("reloadBtn").title);
    $("openBtn").title = splitDir ? "두 사이트 모두 새 탭으로 열기" : "새 탭으로 열기";

    if (!embeddable(left)) {
      $("blocked").innerHTML = `
        <div class="notice">
          <h1>${esc(left.name)}</h1>
          <p>${left.category === CUSTOM_CATEGORY
            ? "새 탭으로 열도록 설정한 사이트입니다."
            : "이 사이트는 다른 사이트 안에 표시되는 것을 막고 있어서 새 탭에서만 열 수 있습니다."}</p>
          <a class="icon-btn" href="${esc(left.url)}" target="_blank" rel="noopener">↗ 새 탭에서 열기</a>
        </div>`;
      return;
    }

    const lf = getFrame(left);
    lf.hidden = false;
    lf.classList.add("pane-left");
    if (splitDir) {
      const rf = getFrame(right);
      rf.hidden = false;
      rf.classList.add("pane-right");
      $("paneNameL").textContent = left.name;
      $("paneNameR").textContent = right.name;
      $("paneOpenL").href = left.url;
      $("paneOpenR").href = right.url;
    }
    // 사이트별 안내: '다시 보지 않기'를 누른 사이트는 건너뛴다
    const dismissed = store.get("hint-dismissed", []);
    const hintAt = [[left, "left"], ...(splitDir ? [[right, "right"]] : [])].find(([s]) => s.hint && !dismissed.includes(s.id));
    if (hintAt) {
      $("hintText").textContent = hintAt[0].hint;
      $("hint").dataset.pane = hintAt[1];
      $("hint").dataset.site = hintAt[0].id;
      $("hintNever").hidden = false;
      $("hint").hidden = false;
    }
    updateLoading();
  }

  // 좌우·위아래 버튼: 둘 다 안 되면 숨기고, 한쪽만 안 되면 그 버튼을 흐리게 두고 이유를 툴팁으로
  const SPLIT_BTN = { row: "splitRowBtn", col: "splitColBtn" };
  const SPLIT_NAME = { row: "좌우 나란히 보기", col: "위아래 나란히 보기" };
  function renderSplitControls(dirs) {
    const col = splitDir === "col";
    for (const d of ["row", "col"]) {
      const b = $(SPLIT_BTN[d]), ok = dirs.includes(d);
      b.hidden = !dirs.length;
      b.classList.toggle("off", !ok);
      b.classList.toggle("on", splitDir === d);
      b.setAttribute("aria-disabled", String(!ok));
      b.title = !ok ? `${SPLIT_NAME[d]} — 창 ${d === "row" ? "너비" : "높이"}가 부족합니다`
        : splitDir === d ? `${SPLIT_NAME[d]} 닫기` : SPLIT_NAME[d];
      b.setAttribute("aria-label", b.title);
    }
    $("swapBtn").textContent = col ? "⇅" : "⇄";
    $("swapBtn").title = col ? "위아래 바꾸기" : "좌우 바꾸기";
    $("splitter").setAttribute("aria-orientation", col ? "horizontal" : "vertical");
    $("splitter").setAttribute("aria-label", col ? "위아래 높이 조절" : "좌우 너비 조절");
    $("splitter").title = col ? "드래그해서 높이 조절 · 더블클릭하면 반반" : "드래그해서 너비 조절 · 더블클릭하면 반반";
    if (splitDir) $("splitter").setAttribute("aria-valuenow", Math.round(splitPct[splitDir]));
  }

  // 화면 크기나 사이드바 접힘이 바뀌어 쓸 수 있는 방향이 달라지면 다시 그린다
  let lastDirs = "";
  function refreshSplitDirs() {
    const key = splitDirs().join();
    if (key !== lastDirs) { lastDirs = key; render(); }
  }
  addEventListener("resize", refreshSplitDirs);

  // 칸 안의 사이트를 누르면 포커스가 그 iframe으로 간다. iframe 안 클릭은 이 문서에서 보이지 않으므로 포커스로 알아낸다
  function setActivePane(pane) {
    activePane = pane;
    $("paneHeadL").classList.toggle("active", !!splitDir && pane === "left");
    $("paneHeadR").classList.toggle("active", !!splitDir && pane === "right");
  }
  // 한 칸의 iframe에서 다른 칸의 iframe으로 바로 옮기면 이 문서에는 아무 이벤트도 오지 않으므로,
  // 나란히 보기 중 포커스가 이 문서 밖(iframe·다른 탭·다른 앱)에 있는 동안만 주기적으로 확인한다
  let paneTimer = null;
  function stopPaneTimer() { clearInterval(paneTimer); paneTimer = null; }
  function syncActivePane() {
    if (!splitDir) { stopPaneTimer(); return; }
    const el = document.activeElement;
    if (el?.classList.contains("pane-left")) setActivePane("left");
    else if (el?.classList.contains("pane-right")) setActivePane("right");
  }
  addEventListener("blur", () => {
    if (!splitDir) return;
    setTimeout(syncActivePane);
    paneTimer ??= setInterval(syncActivePane, 300);
  });
  addEventListener("focus", stopPaneTimer);
  // 칸 제목줄을 눌러도 그 칸으로. 단 바꾸기 버튼은 두 칸 공용이라 제외 (왼쪽 제목줄에 있음)
  $("paneHeadL").addEventListener("pointerdown", e => { if (!e.target.closest("#swapBtn")) setActivePane("left"); });
  $("paneHeadR").addEventListener("pointerdown", () => setActivePane("right"));

  // ---- 검색 팔레트 (Ctrl+K) ----
  let paletteMode = "go", paletteResults = [], paletteSel = 0;

  function openPalette(mode) {
    paletteMode = mode;
    $("paletteMode").hidden = mode !== "split";
    $("paletteInput").value = "";
    $("palette").hidden = false;
    renderPalette();
    $("paletteInput").focus();
  }
  function closePalette() { $("palette").hidden = true; }

  function renderPalette() {
    const terms = $("paletteInput").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const pool = paletteMode === "split" ? ALL.filter(i => embeddable(i) && i.id !== current) : ALL;
    const ordered = [...pool.filter(i => favorites.includes(i.id)), ...pool.filter(i => !favorites.includes(i.id))];
    paletteResults = ordered.filter(i => {
      const hay = `${i.name} ${i.category} ${i.desc || ""} ${new URL(i.url).hostname}`.toLowerCase();
      return terms.every(t => hay.includes(t));
    });
    paletteSel = Math.min(paletteSel, Math.max(paletteResults.length - 1, 0));
    $("paletteList").innerHTML = paletteResults.length
      ? paletteResults.map((i, n) => `
          <li role="option" data-n="${n}" aria-selected="${n === paletteSel}">
            ${siteIcon(i, 16)}${esc(i.name)}${badge(i)}${favorites.includes(i.id) ? `<span class="fav">${icon("star", 13)}</span>` : ""}<small>${i.category}</small>
          </li>`).join("")
      : '<li class="empty">검색 결과가 없습니다</li>';
    const sel = $("paletteList").querySelector('[aria-selected="true"]');
    if (sel) sel.scrollIntoView({ block: "nearest" });
  }

  function choosePalette(n) {
    const item = paletteResults[n];
    if (!item) return;
    closePalette();
    if (paletteMode === "split") {
      track("open", { ...siteProps(item), from: "split" });
      track("split", { dir: store.get("split-dir", "row") });
      // 새로 띄운 사이트로 포커스 (render가 iframe을 만든 다음에)
      activePane = "right";
      addEventListener("hashchange", () => frames[item.id]?.focus(), { once: true });
      location.hash = `${current}|${item.id}`;
      return;
    }
    track("open", { ...siteProps(item), from: "search" });
    if (!embeddable(item)) { addRecent(item.id); renderQuick(); window.open(item.url, "_blank", "noopener"); return; }
    go(item.id);
  }

  $("paletteInput").addEventListener("input", () => { paletteSel = 0; renderPalette(); });
  $("paletteInput").addEventListener("keydown", e => {
    if (e.key === "ArrowDown") { paletteSel = Math.min(paletteSel + 1, paletteResults.length - 1); renderPalette(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { paletteSel = Math.max(paletteSel - 1, 0); renderPalette(); e.preventDefault(); }
    else if (e.key === "Enter") { choosePalette(paletteSel); e.preventDefault(); }
  });
  $("paletteList").addEventListener("click", e => {
    const li = e.target.closest("li[data-n]");
    if (li) choosePalette(Number(li.dataset.n));
  });
  $("palette").addEventListener("click", e => { if (e.target === $("palette")) closePalette(); });

  // ---- 이벤트 ----
  function openNav() { $("app").classList.add("nav-open"); }
  function closeNav() { $("app").classList.remove("nav-open"); }

  // 나란히 보기면 상단바 버튼은 두 사이트 모두에, 칸 제목줄 버튼은 그 칸 사이트에만
  const shownIds = () => (splitDir ? [current, currentRight] : [current]).filter(Boolean);
  function refreshFavorites() { renderQuick(); renderFavBtn(); }

  function renderFavBtn() {
    const ids = shownIds(), isFav = ids.length > 0 && ids.every(id => favorites.includes(id));
    const both = ids.length > 1 ? "두 사이트 " : "";
    $("favBtn").classList.toggle("on", isFav);
    $("favBtn").setAttribute("aria-pressed", String(isFav));
    $("favBtn").title = `${both}즐겨찾기 ${isFav ? "해제" : "추가"}`;
    $("favBtn").setAttribute("aria-label", $("favBtn").title);
    for (const [btn, id] of [["paneFavL", current], ["paneFavR", currentRight]]) {
      const on = !!id && favorites.includes(id);
      $(btn).classList.toggle("on", on);
      $(btn).setAttribute("aria-pressed", String(on));
      $(btn).title = `즐겨찾기 ${on ? "해제" : "추가"}`;
      $(btn).setAttribute("aria-label", `이 사이트 ${$(btn).title}`);
    }
  }

  // 사이트 링크 클릭: 새 탭 사이트는 최근 목록만 갱신, 나머지는 나란히 보기 상태를 유지하며 이동
  document.addEventListener("click", e => {
    if (e.target.closest("[data-add-site]")) { openAddDialog(); return; }
    // 메뉴의 별: 사이트를 열지 않고 즐겨찾기만 바꾼다 (모바일 서랍도 닫지 않음)
    const fav = e.target.closest("[data-fav]");
    if (fav) {
      toggleFavorite(fav.dataset.fav);
      renderQuick();
      if (current) renderFavBtn(); else renderHome();
      return;
    }
    const del = e.target.closest("[data-del]");
    if (del) {
      const item = ITEMS[del.dataset.del];
      if (item && confirm(`'${item.name}'을(를) 내 사이트에서 삭제할까요?`)) {
        track("custom-remove", siteProps(item));
        removeCustomSite(item.id);
      }
      return;
    }
    const a = e.target.closest("a[data-id]");
    if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
    const item = ITEMS[a.dataset.id];
    track("open", { ...siteProps(item), from: a.closest("[data-from]")?.dataset.from || "other" });
    closeNav();
    if (!embeddable(item)) { addRecent(item.id); renderQuick(); return; }
    e.preventDefault();
    go(item.id);
  });

  // 상단바·칸 제목줄 고정 아이콘
  $("menuBtn").innerHTML = icon("menu", 18);
  $("favBtn").innerHTML = icon("star", 16);
  $("reloadBtn").innerHTML = icon("refresh", 15);
  $("openBtn").innerHTML = icon("external", 15) + '<span class="label">새 탭</span>';
  $("paneOpenR").innerHTML = $("paneOpenL").innerHTML = icon("external", 13);
  $("paneFavL").innerHTML = $("paneFavR").innerHTML = icon("star", 13);
  $("paneReloadL").innerHTML = $("paneReloadR").innerHTML = icon("refresh", 13);
  $("paneCloseR").innerHTML = icon("x", 13);

  // 라이트·다크 테마 전환 (상태 저장)
  function renderThemeBtn() {
    const dark = document.documentElement.dataset.theme !== "light";
    $("themeBtn").innerHTML = dark
      ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
      : '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
    $("themeBtn").title = dark ? "라이트 테마" : "다크 테마";
    $("themeBtn").setAttribute("aria-label", dark ? "라이트 테마로 전환" : "다크 테마로 전환");
  }
  $("themeBtn").addEventListener("click", () => {
    const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("nikke-hub:theme", next); } catch {}
    renderThemeBtn();
  });
  renderThemeBtn();

  // 모바일은 서랍으로 열고, PC는 사이드바를 접었다 폈다 (상태 저장)
  $("menuBtn").addEventListener("click", () => {
    if (matchMedia("(max-width: 768px)").matches) { openNav(); return; }
    const collapsed = document.documentElement.classList.toggle("nav-collapsed");
    store.set("nav-collapsed", collapsed);
    refreshSplitDirs();
  });
  $("scrim").addEventListener("click", closeNav);
  $("searchBtn").addEventListener("click", () => openPalette("go"));
  // 둘 다 즐겨찾기면 둘 다 해제, 아니면 빠진 쪽을 추가
  $("favBtn").addEventListener("click", () => {
    const ids = shownIds(), allFav = ids.every(id => favorites.includes(id));
    ids.forEach(id => { if (favorites.includes(id) === allFav) toggleFavorite(id); });
    refreshFavorites();
  });
  $("paneFavL").addEventListener("click", () => { toggleFavorite(current); refreshFavorites(); });
  $("paneFavR").addEventListener("click", () => { toggleFavorite(currentRight); refreshFavorites(); });
  // 같은 방향으로 열려 있으면 닫고, 다른 방향으로 열려 있으면 방향만 바꾸고, 아니면 함께 띄울 사이트를 검색창에서 고른다
  function onSplitBtn(dir) {
    if (!splitDirs().includes(dir)) return;
    if (splitDir === dir) { location.hash = current; return; }
    store.set("split-dir", dir);
    if (splitDir) { render(); return; }
    $("paletteMode").textContent = `${dir === "col" ? "아래에" : "오른쪽에"} 띄울 사이트 선택`;
    openPalette("split");
  }
  $("splitRowBtn").addEventListener("click", () => onSplitBtn("row"));
  $("splitColBtn").addEventListener("click", () => onSplitBtn("col"));
  // 포커스된 사이트를 따라가도록 기억한 칸도 함께 바꾼다
  $("swapBtn").addEventListener("click", () => {
    setActivePane(activePane === "left" ? "right" : "left");
    location.hash = `${currentRight}|${current}`;
  });
  $("paneCloseR").addEventListener("click", () => { location.hash = current; });
  function reloadFrame(id) {
    const f = frames[id];
    if (!f) return;
    f.dataset.loading = "1";
    f.src = f.src;
    updateLoading();
  }
  $("reloadBtn").addEventListener("click", () => shownIds().forEach(reloadFrame));
  $("paneReloadL").addEventListener("click", () => reloadFrame(current));
  $("paneReloadR").addEventListener("click", () => reloadFrame(currentRight));
  // 나란히 보기면 두 사이트를 왼쪽부터 연다. 크롬은 한 번 누를 때 새 탭 하나만 허용하므로
  // 두 번째가 막히면(window.open이 null) 이 사이트의 팝업을 허용하는 방법을 알려 준다
  $("openBtn").addEventListener("click", e => {
    if (!splitDir) return;
    e.preventDefault();
    const blocked = [current, currentRight].filter(id => {
      const w = window.open(ITEMS[id].url, "_blank");
      if (w) w.opener = null;
      return !w;
    });
    if (blocked.length) {
      $("hintText").textContent = "브라우저가 두 번째 새 탭을 막았습니다. 주소창 오른쪽의 팝업 차단 아이콘을 눌러 이 사이트의 팝업을 허용하면 다음부터 두 사이트가 함께 열립니다.";
      $("hint").dataset.pane = ""; // 두 사이트에 대한 안내라 전체 너비
      $("hint").dataset.site = "";
      $("hintNever").hidden = true;
      $("hint").hidden = false;
    }
  });
  $("hintClose").addEventListener("click", () => $("hint").hidden = true);
  $("hintNever").addEventListener("click", () => {
    const id = $("hint").dataset.site;
    if (id) store.set("hint-dismissed", [...new Set([...store.get("hint-dismissed", []), id])]);
    $("hint").hidden = true;
  });
  // 나란히 보기 비율 조절: 드래그 · 더블클릭은 반반 · 방향키 (방향별로 비율 저장)
  const SPLIT_VAR = { row: "--split", col: "--split-v" }, SPLIT_KEY = { row: "split", col: "split-v" };
  const splitPct = { row: 50, col: 50 };
  function setSplit(dir, pct) {
    splitPct[dir] = Math.min(80, Math.max(20, pct));
    $("viewport").style.setProperty(SPLIT_VAR[dir], splitPct[dir] + "%");
    if (dir === splitDir) $("splitter").setAttribute("aria-valuenow", Math.round(splitPct[dir]));
  }
  const saveSplit = () => store.set(SPLIT_KEY[splitDir], splitPct[splitDir]);
  setSplit("row", store.get("split", 50));
  setSplit("col", store.get("split-v", 50));
  $("splitter").addEventListener("pointerdown", e => {
    e.preventDefault();
    $("splitter").setPointerCapture(e.pointerId);
    $("viewport").classList.add("resizing");
  });
  $("splitter").addEventListener("pointermove", e => {
    if (!$("splitter").hasPointerCapture(e.pointerId)) return;
    const r = $("viewport").getBoundingClientRect();
    setSplit(splitDir, splitDir === "col" ? (e.clientY - r.top) / r.height * 100 : (e.clientX - r.left) / r.width * 100);
  });
  const endResize = () => {
    if (!$("viewport").classList.contains("resizing")) return;
    $("viewport").classList.remove("resizing");
    saveSplit();
  };
  $("splitter").addEventListener("pointerup", endResize);
  $("splitter").addEventListener("lostpointercapture", endResize);
  $("splitter").addEventListener("dblclick", () => { setSplit(splitDir, 50); saveSplit(); });
  $("splitter").addEventListener("keydown", e => {
    const step = splitDir === "col"
      ? { ArrowUp: -2, ArrowDown: 2 }[e.key]
      : { ArrowLeft: -2, ArrowRight: 2 }[e.key];
    if (!step) return;
    e.preventDefault();
    setSplit(splitDir, splitPct[splitDir] + step);
    saveSplit();
  });

  window.addEventListener("hashchange", render);
  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette("go"); }
    else if (e.key === "Escape") { closePalette(); closeNav(); }
  });

  // 주소에 사이트가 지정되지 않았으면 마지막에 보던 화면으로 시작
  const last = store.get("last", null);
  const initialFrom = location.hash.length > 1 ? "link" : last ? "restore" : null; // link: 사이트가 지정된 주소로 들어옴
  if (!location.hash && last) history.replaceState(null, "", "#" + last);
  render();
  if (initialFrom && current) track("open", { ...siteProps(ITEMS[current]), from: initialFrom });
  lastDirs = splitDirs().join();
</script>
</body>
</html>
